<!-- Calendar Page Module for Tempow -->
<!-- Embed this into index.html as a new page or use as standalone -->

<div id="calendar-page" class="page">
  <!-- Calendar Header -->
  <div class="calendar-header">
    <div class="calendar-header-left">
      <button class="calendar-nav-btn" id="prev-month">← Previous</button>
      <h2 id="calendar-title">May 2026</h2>
      <button class="calendar-nav-btn" id="next-month">Next →</button>
      <button class="calendar-today-btn" id="today-btn">Today</button>
    </div>
    <div class="calendar-header-right">
      <button class="calendar-sync-btn" id="sync-google-btn">
        <span class="sync-icon">☁</span> Sync to Google Calendar
      </button>
      <button class="calendar-settings-btn" id="calendar-settings">⚙️</button>
    </div>
  </div>

  <!-- Calendar Container -->
  <div class="calendar-container">
    <!-- Month View -->
    <div class="calendar-month-view">
      <div class="calendar-weekdays">
        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
      </div>
      <div class="calendar-days" id="calendar-grid"></div>
    </div>

    <!-- Right Sidebar: Upcoming Tasks -->
    <div class="calendar-sidebar">
      <div class="sidebar-section">
        <h3 class="sidebar-title">📋 Transfer Tasks</h3>
        <div class="task-transfer-area" id="pending-tasks-list">
          <!-- Tasks from main app will be listed here -->
          <p class="empty-state">No tasks pending transfer</p>
        </div>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-title">📅 Today's Events</h3>
        <div class="today-events-list" id="today-events"></div>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-title">⏰ Scheduled Tasks</h3>
        <div class="scheduled-tasks-list" id="scheduled-tasks"></div>
      </div>
    </div>
  </div>

  <!-- Day Detail Modal -->
  <div class="calendar-modal-bg" id="calendar-modal-bg">
    <div class="calendar-modal">
      <div class="modal-header">
        <h2 id="modal-date-title">May 15, 2026</h2>
        <button class="modal-close-btn" id="modal-close">&times;</button>
      </div>
      
      <div class="modal-content">
        <div class="modal-section">
          <h3>Tasks for this day</h3>
          <div class="modal-tasks-list" id="modal-tasks-list"></div>
        </div>

        <div class="modal-section">
          <h3>Add New Event</h3>
          <form id="add-event-form" class="event-form">
            <input type="text" id="event-title" placeholder="Event title" required>
            <div class="time-inputs">
              <input type="time" id="event-time" value="09:00">
              <input type="number" id="event-duration" placeholder="Duration (min)" value="60" min="15" step="15">
            </div>
            <textarea id="event-notes" placeholder="Notes (optional)"></textarea>
            <div class="modal-actions">
              <button type="submit" class="btn-save">Save Event</button>
              <button type="button" class="btn-cancel" id="form-cancel">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Google Calendar Auth Modal -->
  <div class="google-auth-modal-bg" id="google-auth-modal">
    <div class="google-auth-modal">
      <h2>Connect to Google Calendar</h2>
      <p>Allow Tempow to sync your tasks with Google Calendar</p>
      <div class="auth-options">
        <button class="btn-google-auth" id="google-auth-btn">
          🔗 Connect Google Calendar
        </button>
        <button class="btn-google-auth-cancel" id="google-auth-cancel">Cancel</button>
      </div>
      <p class="auth-note">Your data stays private and secure</p>
    </div>
  </div>
</div>

<!-- JavaScript for Calendar Functionality -->
<script>
(function() {
  'use strict';

  let currentDate = new Date();
  let calendarEvents = JSON.parse(localStorage.getItem('tempow-calendar-events')) || {};
  let googleAuthToken = localStorage.getItem('tempow-google-auth-token');
  let selectedDate = null;

  // Initialize Calendar
  function initCalendar() {
    renderCalendar();
    setupEventListeners();
    updateTodayEvents();
    updateScheduledTasks();
  }

  // Render Calendar Grid
  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const prevLastDay = new Date(year, month, 0);

    const firstDayOfWeek = firstDay.getDay();
    const lastDateOfMonth = lastDay.getDate();
    const lastDateOfPrevMonth = prevLastDay.getDate();

    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    // Title
    document.getElementById('calendar-title').textContent = 
      firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    // Previous month days
    for (let i = firstDayOfWeek - 1; i >= 0; i--) {
      const dayDiv = createDayElement(lastDateOfPrevMonth - i, true);
      grid.appendChild(dayDiv);
    }

    // Current month days
    for (let i = 1; i <= lastDateOfMonth; i++) {
      const dayDiv = createDayElement(i, false, year, month);
      grid.appendChild(dayDiv);
    }

    // Next month days
    const totalCells = grid.children.length;
    const remainingCells = 42 - totalCells;
    for (let i = 1; i <= remainingCells; i++) {
      const dayDiv = createDayElement(i, true);
      grid.appendChild(dayDiv);
    }
  }

  function createDayElement(day, isOtherMonth, year, month) {
    const dayDiv = document.createElement('div');
    dayDiv.className = 'calendar-day';
    if (isOtherMonth) dayDiv.classList.add('other-month');

    if (!isOtherMonth) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const today = new Date();
      if (dateStr === today.toISOString().split('T')[0]) {
        dayDiv.classList.add('today');
      }
      dayDiv.dataset.date = dateStr;
      dayDiv.addEventListener('click', () => openDayModal(dateStr));
    }

    dayDiv.innerHTML = `<div class="day-number">${day}</div><div class="day-events"></div>`;
    return dayDiv;
  }

  function openDayModal(dateStr) {
    selectedDate = dateStr;
    const date = new Date(dateStr + 'T00:00:00');
    document.getElementById('modal-date-title').textContent = 
      date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    
    const eventsForDay = calendarEvents[dateStr] || [];
    const tasksList = document.getElementById('modal-tasks-list');
    
    if (eventsForDay.length === 0) {
      tasksList.innerHTML = '<p class="empty-state">No events scheduled</p>';
    } else {
      tasksList.innerHTML = eventsForDay.map((event, idx) => `
        <div class="modal-task-item">
          <span><strong>${event.time}</strong> - ${event.title}</span>
          <button class="delete-event-btn" data-idx="${idx}" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;">×</button>
        </div>
      `).join('');
      
      tasksList.querySelectorAll('.delete-event-btn').forEach(btn => {
        btn.addEventListener('click', (e) => deleteEvent(dateStr, parseInt(e.target.dataset.idx)));
      });
    }

    document.getElementById('add-event-form').reset();
    document.getElementById('calendar-modal-bg').classList.add('open');
  }

  function closeModal() {
    document.getElementById('calendar-modal-bg').classList.remove('open');
    selectedDate = null;
  }

  function saveEvent(e) {
    e.preventDefault();
    if (!selectedDate) return;

    const title = document.getElementById('event-title').value;
    const time = document.getElementById('event-time').value;
    const notes = document.getElementById('event-notes').value;

    if (!calendarEvents[selectedDate]) {
      calendarEvents[selectedDate] = [];
    }

    calendarEvents[selectedDate].push({ title, time, notes });
    localStorage.setItem('tempow-calendar-events', JSON.stringify(calendarEvents));

    renderCalendar();
    updateTodayEvents();
    closeModal();
    showNotification('Event saved!');
  }

  function deleteEvent(dateStr, index) {
    if (calendarEvents[dateStr]) {
      calendarEvents[dateStr].splice(index, 1);
      localStorage.setItem('tempow-calendar-events', JSON.stringify(calendarEvents));
      renderCalendar();
      updateTodayEvents();
      openDayModal(dateStr);
    }
  }

  function updateTodayEvents() {
    const today = new Date().toISOString().split('T')[0];
    const todayEvents = calendarEvents[today] || [];
    const container = document.getElementById('today-events');
    
    if (todayEvents.length === 0) {
      container.innerHTML = '<p class="empty-state">No events today</p>';
    } else {
      container.innerHTML = todayEvents.map(event => `
        <div class="event-item">
          <div class="event-time">
            <span class="event-time-val">${event.time}</span>
          </div>
          <div class="event-name">${event.title}</div>
        </div>
      `).join('');
    }
  }

  function updateScheduledTasks() {
    const container = document.getElementById('scheduled-tasks');
    const scheduled = [];
    
    Object.keys(calendarEvents).forEach(dateStr => {
      if (calendarEvents[dateStr].length > 0) {
        scheduled.push({ date: dateStr, events: calendarEvents[dateStr] });
      }
    });

    if (scheduled.length === 0) {
      container.innerHTML = '<p class="empty-state">No scheduled tasks</p>';
    } else {
      container.innerHTML = scheduled.slice(0, 5).map(item => `
        <div class="scheduled-item">
          <div style="font-size:10px;color:var(--muted);">${new Date(item.date).toLocaleDateString()}</div>
          <div style="font-weight:500;margin-top:2px;">${item.events[0].title}</div>
        </div>
      `).join('');
    }
  }

  function setupEventListeners() {
    document.getElementById('prev-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById('next-month').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    document.getElementById('today-btn').addEventListener('click', () => {
      currentDate = new Date();
      renderCalendar();
    });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('form-cancel').addEventListener('click', closeModal);
    document.getElementById('add-event-form').addEventListener('submit', saveEvent);

    document.getElementById('sync-google-btn').addEventListener('click', () => {
      document.getElementById('google-auth-modal').classList.add('open');
    });

    document.getElementById('google-auth-btn').addEventListener('click', handleGoogleAuth);
    document.getElementById('google-auth-cancel').addEventListener('click', () => {
      document.getElementById('google-auth-modal').classList.remove('open');
    });
  }

  function handleGoogleAuth() {
    // Placeholder for Google Calendar API integration
    // In production, use Google Calendar API with OAuth 2.0
    alert('Google Calendar integration coming soon!\n\nIn production, this would:\n1. Open Google OAuth consent screen\n2. Request calendar.events scope\n3. Sync all events to your Google Calendar');
    document.getElementById('google-auth-modal').classList.remove('open');
    showNotification('Google Calendar sync ready!');
  }

  function showNotification(msg) {
    const notif = document.createElement('div');
    notif.style.cssText = 'position:fixed;top:20px;right:20px;background:var(--active);color:#0a1f16;padding:12px 20px;border-radius:8px;font-size:12px;z-index:9999;animation:slideIn 0.3s ease';
    notif.textContent = msg;
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
  }

  // Close modal on outside click
  document.addEventListener('click', (e) => {
    const modalBg = document.getElementById('calendar-modal-bg');
    if (e.target === modalBg) closeModal();
  });

  // Initialize on page load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCalendar);
  } else {
    initCalendar();
  }
})();
</script>
