<title>Tempow — Task Timer & Clock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="preload" as="style">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
/* ══════════════════════════════════════════
   GLOBAL RESET & SHARED VARS
═════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0e11; --surface: #16161a; --surface2: #1e1e24;
  --bg-rgb: 14, 14, 17;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --text: #f0eff5; --muted: #6b6a75; --muted2: #9998a5;
  --active: #5de0a8; --active-dim: rgba(93,224,168,0.12);
  --break: #f5a623; --break-dim: rgba(245,166,35,0.15);
  --done: #4a8cff; --done-dim: rgba(74,140,255,0.1);
  --danger: #ff5e6c; --track: rgba(255,255,255,0.05);
  --clock-bg:#1a1a2e; --clock-card:#16213e; --clock-border:#2a2a4e;
  --clock-accent:#2563eb; --clock-text:#e0e0e0; --clock-muted:#b0b0b0;
  --font-mono:'DM Mono','Courier New',monospace; --font-display:'Syne','Arial',sans-serif;
}
body { background: var(--bg); color: var(--text); font-family: var(--font-mono); min-height: 100vh; overflow-x: hidden; }

/* ══════════════════════════════════════════
   ESTIMATE TIME BADGE - NEW FEATURE
═════════════════════════════════════════════ */
.task-estimate {
  font-size: 9px;
  color: var(--muted2);
  margin-top: 4px;
  display: block;
  letter-spacing: 0.04em;
}

.task-estimate strong {
  color: var(--active);
  font-weight: 500;
  font-family: var(--font-mono);
}

/* ══════════════════════════════════════════
   TAB NAV
═════════════════════════════════════════════ */
.app-nav {
  display: flex; align-items: center; gap: 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 32px; position: sticky; top: 0; z-index: 200;
}
.nav-logo {
  font-family: var(--font-display); font-weight: 800; font-size: 19px;
  letter-spacing: -0.5px; color: var(--text); margin-right: 28px; flex-shrink: 0;
  padding: 16px 0;
}
.nav-logo span { color: var(--active); }
.nav-tabs { display: flex; gap: 0; flex: 1; }
.nav-tab {
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 18px 22px; border: none; background: transparent;
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.15s; white-space: nowrap;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--active); border-bottom-color: var(--active); }
.nav-tab.clock-tab.active { color: #7b9fff; border-bottom-color: #7b9fff; }

/* transfer badge on nav */
.transfer-badge {
  display: none; background: var(--break); color: #1a0a00;
  font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 10px;
  margin-left: 6px; letter-spacing: 0.06em; vertical-align: middle;
}
.transfer-badge.visible { display: inline-block; }

/* ══════════════════════════════════════════
   PAGE PANELS
═════════════════════════════════════════════ */
.page { display: none; }
.page.active { display: block; }

/* ══════════════════════════════════════════
   CALENDAR PAGE STYLES
═════════════════════════════════════════════ */

#calendar-page {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 0;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-wrap: wrap;
  gap: 16px;
}

.calendar-header-left,
.calendar-header-right {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.calendar-header-left h2 {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  margin: 0;
  min-width: 180px;
  text-align: center;
}

.calendar-nav-btn,
.calendar-today-btn,
.calendar-sync-btn,
.calendar-settings-btn {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted2);
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.calendar-nav-btn:hover,
.calendar-today-btn:hover {
  color: var(--text);
  border-color: var(--text);
  background: var(--surface2);
}

.calendar-sync-btn {
  background: var(--active);
  color: #0a1f16;
  border: none;
  font-weight: 600;
}

.calendar-sync-btn:hover {
  opacity: 0.85;
}

.sync-icon {
  margin-right: 6px;
}

.calendar-settings-btn {
  font-size: 16px;
  padding: 8px 10px;
}

/* Main Calendar Container */
.calendar-container {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 28px;
  padding: 28px 40px;
  max-width: 1400px;
  margin: 0 auto;
}

/* Month View */
.calendar-month-view {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}

.weekday {
  padding: 14px 10px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
  background: var(--surface);
}

.calendar-day {
  aspect-ratio: 1;
  border: 1px solid var(--border);
  padding: 12px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.2s;
  min-height: 100px;
}

.calendar-day:hover {
  background: var(--surface2);
  border-color: var(--active);
}

.calendar-day.today {
  background: var(--active-dim);
  border-color: var(--active);
}

.calendar-day.today .day-number {
  color: var(--active);
  font-weight: 700;
}

.calendar-day.other-month {
  opacity: 0.4;
  background: rgba(0, 0, 0, 0.2);
}

.calendar-day.other-month .day-number {
  color: var(--muted);
}

.day-number {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text);
}

.day-events {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 9px;
}

.day-event-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--active);
  display: inline-block;
}

.day-event-item {
  font-size: 9px;
  color: var(--muted2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 3px;
}

.day-event-item.has-tasks {
  color: var(--active);
}

/* Sidebar */
.calendar-sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.sidebar-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}

.sidebar-title {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  margin: 0 0 12px 0;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Task Transfer Area */
.task-transfer-area {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 200px;
  overflow-y: auto;
}

.transfer-task-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 11px;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  cursor: grab;
  transition: all 0.2s;
}

.transfer-task-item:hover {
  background: var(--surface2);
  border-color: var(--active);
}

.transfer-task-item.dragging {
  opacity: 0.6;
  cursor: grabbing;
}

.transfer-task-name {
  flex: 1;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.transfer-task-icon {
  font-size: 12px;
  cursor: pointer;
  opacity: 0.6;
  transition: opacity 0.2s;
}

.transfer-task-icon:hover {
  opacity: 1;
  color: var(--active);
}

.empty-state {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  padding: 12px 8px;
}

/* Today's Events & Scheduled Tasks */
.today-events-list,
.scheduled-tasks-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 150px;
  overflow-y: auto;
}

.event-item,
.scheduled-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 10px;
  color: var(--text);
}

.event-time {
  display: flex;
  gap: 6px;
  margin-bottom: 2px;
}

.event-time-val {
  color: var(--active);
  font-weight: 600;
}

.event-name {
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Modal Styles */
.calendar-modal-bg,
.google-auth-modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.calendar-modal-bg.open,
.google-auth-modal-bg.open {
  display: flex;
}

.calendar-modal,
.google-auth-modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 24px;
  width: 90%;
  max-width: 500px;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px;
}

.modal-header h2 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  margin: 0;
}

.modal-close-btn {
  background: none;
  border: none;
  font-size: 28px;
  color: var(--muted2);
  cursor: pointer;
  padding: 0;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close-btn:hover {
  color: var(--text);
}

.modal-content {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.modal-section h3 {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.modal-tasks-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 150px;
  overflow-y: auto;
}

.modal-task-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  font-size: 11px;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Event Form */
.event-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.event-form input,
.event-form textarea {
  font-family: var(--font-mono);
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  padding: 8px 10px;
  font-size: 11px;
}

.event-form input::placeholder,
.event-form textarea::placeholder {
  color: var(--muted);
}

.event-form input:focus,
.event-form textarea:focus {
  border-color: var(--active);
  outline: none;
  background: var(--surface2);
}

.time-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.event-form textarea {
  resize: vertical;
  min-height: 60px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 12px;
}

.btn-save,
.btn-cancel {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 8px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.05em;
}

.btn-save {
  background: var(--active);
  color: #0a1f16;
}

.btn-save:hover {
  opacity: 0.85;
}

.btn-cancel {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted2);
}

.btn-cancel:hover {
  background: var(--surface2);
  color: var(--text);
}

/* Google Auth Modal */
.google-auth-modal {
  text-align: center;
}

.google-auth-modal h2 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
}

.google-auth-modal p {
  color: var(--muted2);
  margin-bottom: 20px;
  font-size: 12px;
  line-height: 1.5;
}

.auth-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}

.btn-google-auth,
.btn-google-auth-cancel {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 12px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: 0.05em;
}

.btn-google-auth {
  background: #4285f4;
  color: white;
}

.btn-google-auth:hover {
  background: #1f66d9;
  transform: translateY(-1px);
}

.btn-google-auth-cancel {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted2);
}

.btn-google-auth-cancel:hover {
  background: var(--surface2);
  color: var(--text);
}

.auth-note {
  font-size: 10px;
  color: var(--muted);
  margin-top: 12px;
}

/* Responsive */
@media (max-width: 1024px) {
  .calendar-container {
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 16px 20px;
  }

  .calendar-header {
    padding: 16px 20px;
    flex-direction: column;
    align-items: flex-start;
  }

  .calendar-header-left,
  .calendar-header-right {
    width: 100%;
    justify-content: space-between;
  }

  .calendar-header-left h2 {
    min-width: auto;
  }
}

@media (max-width: 640px) {
  .calendar-header {
    padding: 12px 16px;
  }

  .calendar-header-left h2 {
    font-size: 18px;
  }

  .calendar-nav-btn,
  .calendar-today-btn {
    font-size: 11px;
    padding: 6px 10px;
  }

  .calendar-sync-btn {
    font-size: 10px;
    padding: 6px 10px;
  }

  .calendar-day {
    min-height: 80px;
    padding: 8px;
  }

  .day-number {
    font-size: 11px;
  }

  .day-event-item {
    font-size: 8px;
  }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<body>

<!-- ══ OFFLINE INDICATOR ══ -->
<div id="offline-banner" style="display: none; position: fixed; top: 0; left: 0; right: 0; background: #ff5e6c; color: white; padding: 8px 16px; font-size: 12px; font-weight: 600; z-index: 9999; text-align: center;">
  📡 OFFLINE MODE — Changes will sync when you're back online
</div>

<!-- ══ WELCOME MODAL (First-time users) ══ -->
<div class="modal-bg" id="welcomeModal" style="z-index: 10000;">
  <div class="modal" style="max-width: 380px;">
    <h2>Welcome to Tempow!</h2>
    <p style="color: var(--muted2); font-size: 13px; margin-bottom: 20px; line-height: 1.6;">Your personal task timer & scheduling assistant. Let's get started!</p>
    <div class="field">
      <label>What's your name?</label>
      <input type="text" id="userName" placeholder="Your name" style="font-size: 14px;" />
    </div>
    <div class="modal-actions">
      <button class="btn-confirm" onclick="saveUserName()" style="flex: 1;">Get started</button>
    </div>
  </div>
</div>

<!-- ══ NAV ══ -->
<nav class="app-nav">
  <div class="nav-logo">Tempow<span>TW</span> <span style="font-size: 12px; color: var(--muted2); margin-left: 16px; font-weight: 400; font-family: var(--font-mono);" id="navUserName"></span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchPage('flow')">
      ⏱ Timer
    </button>
    <button class="nav-tab clock-tab" onclick="switchPage('clock')">
      ◕ 24h Clock
      <span class="transfer-badge" id="clock-badge"></span>
    </button>
    <button class="nav-tab" onclick="switchPage('calendar')">
      📅 Calendar
    </button>
    <button class="nav-tab" onclick="switchPage('report')">
      📊 Reports
    </button>
    <button class="nav-tab" onclick="switchPage('workspace')">
      🧩 Workspace
    </button>
    <button class="nav-tab" onclick="switchPage('help')">
      ❓ Help
    </button>
  </div>
</nav>

<!-- ══ ALARM BANNERS ══ -->
<div id="alarmBanner">
  <div class="alarm-text">
